services:
  mysql:
    image: mysql:8.4
    command: ["mysqld", "--mysql-native-password=ON"]
    environment:
      MYSQL_DATABASE: replica_home_salon
      MYSQL_USER: replica
      MYSQL_PASSWORD: replica_dev_password
      MYSQL_ROOT_PASSWORD: replica_root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-ureplica",
          "-preplica_dev_password",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql-data:
